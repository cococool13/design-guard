# Reusable taste check. Callers use templates/taste.yml.
# Do not install this workflow, or the Impeccable detector, as a user-level hook.
name: guard

on:
  workflow_call:
    secrets:
      DESIGN_GUARD_READ_TOKEN:
        required: false
        description: >-
          Optional token that can read cococool13/design-guard.
          Needed only when this repo's Actions access is not already
          open to other cococool13 repositories.

permissions:
  contents: read

jobs:
  taste:
    name: taste
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller
        uses: actions/checkout@v4

      - name: Checkout design-guard
        uses: actions/checkout@v4
        with:
          repository: cococool13/design-guard
          # Same commit as this workflow file (the @v1 tag, or whatever ref called it).
          ref: ${{ github.workflow_sha }}
          path: .design-guard
          token: ${{ secrets.DESIGN_GUARD_READ_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Taste guard
        run: bash .design-guard/taste-guard.sh

      # Report only. hashFiles is empty until vendor/impeccable-detector/ exists,
      # so this step stays skipped. Findings must not fail the job.
      - name: Impeccable detector (report only)
        if: hashFiles('.design-guard/vendor/impeccable-detector/**') != ''
        continue-on-error: true
        run: |
          set +e
          vendor="${GITHUB_WORKSPACE}/.design-guard/vendor/impeccable-detector"
          if [[ -f "${vendor}/detect.mjs" ]]; then
            node "${vendor}/detect.mjs" .
          elif [[ -f "${vendor}/cli/main.mjs" ]]; then
            DETECTOR_ENTRY="${vendor}/cli/main.mjs" node --input-type=module -e 'import { pathToFileURL } from "node:url"; const mod = await import(pathToFileURL(process.env.DETECTOR_ENTRY)); await mod.detectCli();'
          else
            echo "::warning title=Impeccable detector::Vendored files have no detect.mjs or cli/main.mjs entry point."
            exit 0
          fi
          status=$?
          if [[ "${status}" -ne 0 ]]; then
            echo "::warning title=Impeccable detector::Report-only scan exited ${status}. This does not fail the job."
          fi
          exit 0
