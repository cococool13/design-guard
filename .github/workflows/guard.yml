# Reusable taste check. Callers use templates/taste.yml.
# Do not install this workflow, or the Impeccable detector, as a user-level hook.
name: guard

on:
  workflow_call:
    secrets:
      DESIGN_GUARD_READ_TOKEN:
        required: false
        description: >-
          Optional token that can read cococool13/design-guard.
          Needed only when this repo's Actions access is not already
          open to other cococool13 repositories.

permissions:
  contents: read

jobs:
  taste:
    name: taste
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller
        uses: actions/checkout@v4

      - name: Checkout design-guard
        uses: actions/checkout@v4
        with:
          repository: cococool13/design-guard
          # Same commit as this workflow file (the @v1 tag, or whatever ref called it).
          ref: ${{ github.workflow_sha }}
          path: .design-guard
          token: ${{ secrets.DESIGN_GUARD_READ_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Taste guard
        run: bash .design-guard/taste-guard.sh

      - name: Set up Node
        if: hashFiles('.design-guard/vendor/impeccable-detector/**') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Report only. Skipped when the vendored detector is absent.
      # Findings are written to the job summary and do not fail the job.
      - name: Impeccable detector (report only)
        if: hashFiles('.design-guard/vendor/impeccable-detector/**') != ''
        continue-on-error: true
        run: node .design-guard/scripts/impeccable-report.mjs "$GITHUB_WORKSPACE"
